<!Doctype html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Dipti Portfolio</title>
   <!-- Font Awesome Fixed - 6.5.1 working version -->
   <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
   <style> @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap');
*{
    padding: 0;
    margin: 0;
    font-family: 'poppins',sans-serif;
    box-sizing: border-box;

}

html{
    overflow: hidden;
}
 
body{
    width: 100%;
    height: 100vh;
    overflow: hidden;
    background: linear-gradient(to right,rgb(255,255,255),rgb(254,215,173));
}

nav{
    width: 100%;
    height: 10vh;
    position: sticky;
}

.nav-container{
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: space-around;
    align-items: center;
}

.logo{
    color: black;
    font-size: 2rem;
    font-weight: bolder;
}

.logo span{
    color: rgb(109, 62,0);
    text-shadow: 0 0 10px rgb(109,67,0);
}

.hamburg, .cancel{
    cursor: pointer;
    position: absolute;
    right: 15px;
    top: 10px;
    color: #ffb86a;
    font-size: 2rem;
    display: none;
}

.nav-container .links{
    display: flex;
    gap: 3rem;
    align-items: center;
    
}

.nav-container .links a{
    position: relative;
    font-size: 1.2rem;
    color: black;
    text-decoration: none;
    font-weight: 500;
    transform: 0.3s linear;
}

.nav-container .links a::before{
    position: absolute;
    content: "";
    bottom: -3px;
    left: 0%;
    width: 100%;
    height: 3px;
    background-color: rgb(109,67,0);
    transition: 0.2s linear;
}

.nav-container .links a{
  border-bottom: none !important;
}
.nav-container .links a::before{
  display: none !important;
}

.nav-container .links a:hover:before{
    width: 100%;
}

.nav-container .contact-btn{
    background-color:transparent;
    padding: 5px 20px;
    border-radius: 20px;
    color: white;
    border: 2px solid rgb(109,67,0);
     
}

.content button, .contant button {
  width: auto !important;
  height: auto !important;
  padding: 14px 35px !important;
  line-height: 1 !important;
  display: inline-block !important;
  
}

.nav-container .contact-btn:hover{
    background-color: rgb(109,67,0);
}

.nav-container .contact-btn a{
    color: white;
}

.nav-container .contact-btn:hover .nav-container .contact-btn:hover a{
    background-color: rgb(109,67,0);
    color: white;
}

.dropdown{
    z-index: 100;
    position: absolute;
    top: 0;
    transform: translateY(-500px);
    width: 100%;
    height: auto;
    backdrop-filter: brightness(40%) blur(3px);
    box-shadow: 0 0 20px black;
    transition: 0.2s linear;
}

.dropdown links a{
    color: white;
    display: flex;
    text-decoration: none;
    justify-content: center;
    padding: 15px 0;
    align-items: center;
    transition: 0.2s linear;
}



section{
    width: 100%;
    height: 90vh;
}

.main-container{
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: space-evenly;
    align-items: center;
}

.main-container .image{
    position: relative;
    z-index: 1;
    width: 40%;
}

.main-container .image img{
    width: 100%;
    border-radius: 20%;
    border: 6px;
    box-shadow: 0 0 0 6px #ffb86a, 0 0 30px #ffb86a;
}

.main-container .contant{
    color: black;
    width: 40%;
    min-height: 100px;
}

.content h1{
    font-size: clamp(1rem, 2rem + 5vw, 3rem);
}

.content span{
    color: rgb(109, 62,0);
    text-shadow: 0 0 10px rgb(109, 62,0);
}

.content .typewriter{
    font-weight: 600;
    display: flex;
    gap: 10px;
    align-items: center;
    white-space: nowrap;
    font-size: clamp(1rem, 1rem + 2vw, 2rem);
    
}

.content .typewriter span{
    color: rgb(109, 62, 0);
    font-size: 2.5rem;
    text-shadow: 0 0 5px rgb(109, 62, 0);
    margin-left: 8px; /* isse 'a' aur 'Student' me space hoga */
    display: inline-block;
    overflow: hidden;
    white-space: nowrap;
    position: relative;
    vertical-align: bottom;
    border-right: 3px solid black;
    width: 0;
    animation: typing 9s steps(8) infinite, blink 0.6s infinite;
    
}

.typewriter span::before{
    content: "Developer";
    animation: words 9s infinite;
}

.typewriter span::after{
    content: "";
    position: absolute;
    width: calc(100% + 8px);
    height: 100%;
    background-color: transparent;
    border-left: 3px solid black;
     right: -8px;
    display: none !important;
    animation: cursor 0.6s infinite, typing 12s steps(10) infinite;
}

@keyframes cursor{
    to{
        border-left: 3px solid transparent;
    }
}

@keyframes words{
    0%,33%{
            content: "Student";
    }
    34%,66%{
            content: "Learner";
    }
    67%,100%{
            content: "Creator";
    }
}

@keyframes typing{
    0%{ width: 0; }
    15%{ width: 7ch; }   /* Student = 7 letters */
    30%{ width: 7ch; }
    35%{ width: 0; }
    50%{ width: 7ch; }
    65%{ width: 7ch; }
    70%{ width: 0; }
    85%{ width: 7ch; }
    95%{ width: 7ch; }
    100%{ width: 0; }
}

body.dark{ background:#121212; color:#fff; }
body.dark a{ color:#fff !important; }
body.dark span{ color:#ffb86a !important; }

.content p{
    font-size: clamp(0.4rem, 0.2rem + 9vw, 1rem);
    margin: 10px 0;
}

.social-links i{
        display: inline-flex;
        justify-content: center;
        align-items: center;
        height: 3rem;
        width: 3rem;
        background-color: transparent;
        border: 0.2rem solid rgb(109,67,0);
        border-radius: 50%;
        color: rgb(109, 67,0);
        margin: 5px 10px;
        font-size: 1.5rem;
        transition: 0.2s linear;
}

.social-links i:hover{
            scale: 1.3;
            color: white;
            background-color: rgb(109, 67,0);
            filter: drop-shadow(0 0 10px rgb(109,67,0));
}

.content button{
    width: 40%;
    height: 6vh;
    margin: 30px;
    background-color: rgb(109, 67,0);
    color: white;
    border: none;
    outline: none;
    font-size: 100%;
    font-weight: 700;
    border-radius: 5px;
    transition: 0.2s linear;
}

.content button:hover{
        scale: 1.1;
        border: 2px solid rgb(109, 67,0);
        font-weight: 700;
        box-shadow: 0 0 40px rgb(109, 67,0);
}

@media(max-width:768px){
        body{
            overflow-y: visible;
        }

        nav .logo{
            position: absolute;
            top: 16px;
            left: 15px;
            font-size: 1.5rem;
        }
        .main-container{
              display: flex;
             flex-direction: column;
             height: auto !important;
             padding-bottom: 40px;
        }

        .nav-container .links{
            display: none;
        }

        .hamburg,.cancel{
              display: block;
        }
        .main-container .content{
            width: 90%;
            order: 2;
        }
        .social-links{
            display: flex !important;
            justify-content: center;
        }
        .social-links i{
            width: 2.5rem;
            height: 2.5rem;
            font-size: 1.5rem;
        }
        .cancel{
            color: white;
        }
        .main-container .image{
            width: 65%;
            order: 1;
            margin-bottom: 0px;
        }
}

</style>

</head>
